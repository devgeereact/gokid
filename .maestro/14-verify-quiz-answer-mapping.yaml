appId: com.gokid.app
name: "14 - Regression: the answer recorded equals the answer tapped (P0-5 fix)"
# The invariant: whatever option the child taps must be the option the app grades and records.
#
# Before the fix, api/quiz re-shuffled the options on every re-fire of the serving effect (Clerk's
# getToken sat in its dependency array), so the tapped index pointed at a different option by the
# time it was read: "Yesterday" tapped, "Happily" recorded.
#
# This flow never names a question or an answer. It reads the first option's label off the screen,
# taps that row, grades it, and asserts the same row still carries the same label -- which is
# exactly what a re-shuffle would break, whatever question the 12-hour no-repeat rule serves today.
---
- launchApp:
    clearState: false
- tapOn: "Jacob K, Year 4"
- openLink: "gokid://quiz/instructions/y4-mult-div"
- assertVisible: "Start quiz"
- tapOn: "Start quiz"
- takeScreenshot: 14a-quiz-q1-before
- copyTextFrom:
    id: "quiz-option-0"
- tapOn:
    id: "quiz-option-0"
- tapOn: "Check answer"
- takeScreenshot: 14b-answer-recorded
# The quiz grades in place -- the row turns green or red and the CTA becomes "Next". There is no
# "Correct!" banner here; that wording belongs to the answer-result screen in study-session mode.
- assertVisible: "Next"
- assertVisible:
    id: "quiz-option-0"
    text: "${maestro.copiedText}"
