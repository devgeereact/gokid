appId: com.gokid.app
name: 05 - Session summary -> set-result -> congratulations (continues from 04)
---
# Runs 04 first rather than assuming its final screen is still on the device. Without this the flow
# passes only when invoked immediately after 04 by hand, and fails in any suite run.
- runFlow: 04-study-session-summary.yaml

# 04 ends on the Answer Result for the last card, where "Next card" banks the session and opens the
# summary instead of advancing.
- assertVisible: "Next card"
- tapOn: "Next card"
- extendedWaitUntil:
    visible: "Session Summary"
    timeout: 15000
- assertVisible: "Cards studied"
- takeScreenshot: 05a-session-summary

# Both CTAs sit under the stats block (session-summary/[id].tsx:250-268) and are off-screen on a
# summary with a full set of stats. Scroll before asserting -- Maestro's assertVisible means
# on-screen, not present-in-tree.
- scrollUntilVisible:
    element:
      text: "Continue studying"
    direction: DOWN
    visibilityPercentage: 60
- assertVisible: "Continue studying"
- assertVisible: "Take a break"
- tapOn: "Continue studying"
- extendedWaitUntil:
    notVisible: "Session Summary"
    timeout: 15000
- takeScreenshot: 05b-set-result
