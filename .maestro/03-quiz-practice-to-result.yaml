appId: com.gokid.app
name: 03 - Quiz (practice mode) -> answer questions -> Check answer -> results
# Walks the whole practice-quiz chain: instructions -> five questions -> per-question grading ->
# results. This flow tests the CHAIN, not the score. It answers by position (quiz-option-0), because
# api/quiz shuffles options per serving and the 12-hour no-repeat rule guarantees a different draw
# next run -- an earlier version named options by their text ("After lunch,") and so passed exactly
# once. Whether the option tapped is the option recorded is flow 14's job.
---
- launchApp:
    clearState: false
- tapOn: "Jacob K, Year 4"
# Deep link rather than "Carry on" -> "Take the quiz": that path lands on whichever set happens to be
# the child's Continue set, which changes as they study.
- openLink: "gokid://quiz/instructions/y4-fronted-adverbials"
- assertVisible: "Start quiz"
- takeScreenshot: 03a-quiz-instructions
- tapOn: "Start quiz"
# The questions come from /api/quiz over the network, so the option rows land after the screen does.
- takeScreenshot: 03b-quiz-q1
- extendedWaitUntil:
    visible:
      id: "quiz-option-0"
    timeout: 30000
- tapOn:
    id: "quiz-option-0"
- tapOn: "Check answer"
- takeScreenshot: 03c-quiz-q1-checked
- tapOn: "Next"
- takeScreenshot: 03d-quiz-q2
- extendedWaitUntil:
    visible:
      id: "quiz-option-0"
    timeout: 30000
- tapOn:
    id: "quiz-option-0"
- tapOn: "Check answer"
- tapOn: "Next"
- takeScreenshot: 03e-quiz-q3
- extendedWaitUntil:
    visible:
      id: "quiz-option-0"
    timeout: 30000
- tapOn:
    id: "quiz-option-0"
- tapOn: "Check answer"
- tapOn: "Next"
- takeScreenshot: 03f-quiz-q4
- extendedWaitUntil:
    visible:
      id: "quiz-option-0"
    timeout: 30000
- tapOn:
    id: "quiz-option-0"
- tapOn: "Check answer"
- tapOn: "Next"
- takeScreenshot: 03g-quiz-q5
- extendedWaitUntil:
    visible:
      id: "quiz-option-0"
    timeout: 30000
- tapOn:
    id: "quiz-option-0"
- tapOn: "Check answer"
- takeScreenshot: 03h-quiz-q5-checked
- tapOn: "See results"
- takeScreenshot: 03i-quiz-results
